name: Build Parin Litner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.parin .
          rm -rf test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android launcher package
        run: |
          test -f android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q 'package com.parin.parin_litner' android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q 'com.parin.parin_litner.MainActivity' android/app/src/main/AndroidManifest.xml

      - name: Set Android app label
        run: |
          sed -i 's/android:label="parin_litner"/android:label="Parin Litner"/' android/app/src/main/AndroidManifest.xml || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -p build/app/outputs/flutter-apk/app-release.apk classes.dex | strings | grep -q 'com/parin/parin_litner/MainActivity'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
