name: parin_litner
description: Parin Litner - a stable multilingual Leitner flashcard app.
publish_to: 'none'
version: 7.0.0+20

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  file_picker: ^12.2.0
  audioplayers: ^6.8.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/parin_litner_icon.png
    - assets/audio/
