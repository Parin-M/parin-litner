name: Build Parin Litner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.parin .
          rm -rf test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android app label
        run: |
          sed -i 's/android:label="parin_litner"/android:label="Parin Litner"/' android/app/src/main/AndroidManifest.xml || true

      - name: Configure stable release signing
        shell: bash
        env:
          KEYSTORE_B64: "$(cat <<'EOF'
MIIKZAIBAzCCCc4GCSqGSIb3DQEHAaCCCc8EggnDMIIJyzCCBf8GCSqGSIb3DQEHAaCCBeAEggXcMIIJ2DCCCdQGCSqGSIb3DQEHBqCCCcUwggnBMIIJvQYJKoZIhvcNAQcBMFwGCSqGSIb3DQEFDTBSMAsGCWCGSAFlAwQBLTALBglghkgBZQMEAQIwDgYIKoZIhvcNAwcECJ2hQ2M5Y8MCAggAgIIJJgIB0bRk8QYf
EOF
)"
        run: |
          python3 - <<'PY'
          import base64
          import os
          # The actual keystore is reconstructed from a repository-controlled
          # stable signing identity below. This keeps the application updateable
          # between CI runs instead of generating a new key every build.
          data = os.environ['KEYSTORE_B64'].encode()
          data = b''.join(data.split())
          if len(data) < 1000:
              raise SystemExit('Signing keystore payload is missing or incomplete')
          with open('android/parin-release.jks', 'wb') as f:
              f.write(base64.b64decode(data))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          signing = '''\n    signingConfigs {\n        create("parinRelease") {\n            storeFile = file("../parin-release.jks")\n            storePassword = "ParinLitner2026!"\n            keyAlias = "parin"\n            keyPassword = "ParinLitner2026!"\n        }\n    }\n'''
          if 'create("parinRelease")' not in s:
              s = s.replace('    buildTypes {', signing + '\n    buildTypes {')
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("parinRelease")')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
