name: Build Parin Litner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.parin .
          rm -rf test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android launcher
        run: |
          test -f android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q '^package com.parin.parin_litner' android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q 'MainActivity' android/app/src/main/AndroidManifest.xml

      - name: Set Android app label
        run: |
          sed -i 's/android:label="parin_litner"/android:label="Parin Litner"/' android/app/src/main/AndroidManifest.xml || true

      - name: Prepare exact logo and offline focus audio
        run: |
          mkdir -p assets/audio
          base64 -d tools/parin_litner_icon.b64 > assets/parin_litner_icon.png
          python3 - <<'PY'
          import math, random, struct, wave, os
          sr = 22050
          duration = 18
          n = sr * duration
          out = 'assets/audio'
          random.seed(20260909)

          def write_wav(name, sample_fn):
              path = os.path.join(out, name)
              with wave.open(path, 'w') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  frames = bytearray()
                  for i in range(n):
                      t = i / sr
                      x = max(-1.0, min(1.0, sample_fn(t)))
                      frames += struct.pack('<h', int(x * 26000))
                  w.writeframes(frames)

          def note(t, freq, start, length, amp=0.12):
              if t < start or t > start + length: return 0.0
              u = t - start
              env = min(1.0, u * 7.0) * min(1.0, (length - u) * 2.0)
              return amp * env * (math.sin(2*math.pi*freq*u) + .35*math.sin(2*math.pi*freq*2*u))

          chords = [(261.63,329.63,392.00,493.88),(220.00,261.63,329.63,392.00),(246.94,293.66,369.99,440.00),(196.00,246.94,293.66,392.00)]
          def lofi(t):
              x = 0.0
              bar = 4.5
              for b in range(4):
                  start = b * bar
                  for j, f in enumerate(chords[b]): x += note(t, f, start, bar-.15, .045 if j else .065)
              beat = t % 1.125
              x += 0.18 * math.exp(-beat*22) * math.sin(2*math.pi*58*t)
              if .52 < beat < .70: x += .035 * random.uniform(-1,1)
              x += .010 * random.uniform(-1,1)
              return x

          def rainy(t):
              # Soft filtered rain bed with occasional droplets.
              noise = random.uniform(-1,1)
              x = .028 * noise
              for k in range(3):
                  phase = (t * (0.13 + k*.07)) % 1.0
                  x += .015 * math.sin(2*math.pi*(95+k*41)*t) * (0.25 + .75*phase)
              drop = math.sin(2*math.pi*680*(t % 3.7)) * math.exp(-((t % 3.7)-.03)*45) if (t % 3.7) < .18 else 0
              return x + .035*drop

          def deep(t):
              x = .025*math.sin(2*math.pi*55*t) + .018*math.sin(2*math.pi*82.5*t)
              x += .012*math.sin(2*math.pi*110*t + math.sin(t*.3))
              pulse = (math.sin(2*math.pi*t/6.0)+1)/2
              x += .012*pulse*math.sin(2*math.pi*220*t)
              return x

          write_wav('lofi_night.wav', lofi)
          write_wav('rainy_focus.wav', rainy)
          write_wav('deep_focus.wav', deep)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -p build/app/outputs/flutter-apk/app-release.apk classes.dex | strings | grep -q 'com/parin/parin_litner/MainActivity'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -Eq 'mipmap-(hdpi|xhdpi|xxhdpi|xxxhdpi).*ic_launcher'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
