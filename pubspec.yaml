name: parin_litner
description: Parin Litner - a modern multilingual Leitner flashcard app.
publish_to: 'none'
version: 6.1.0+9

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  file_picker: ^12.2.0
  audioplayers: ^6.8.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/parin_litner_icon.png
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/parin_litner_icon.png
  adaptive_icon_background: '#17142B'
  adaptive_icon_foreground: assets/parin_litner_icon.png
  min_sdk_android: 21
