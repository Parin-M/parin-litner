name: Build Parin Litner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.parin .
          rm -rf test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android launcher
        run: |
          test -f android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q '^package com.parin.parin_litner' android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q 'MainActivity' android/app/src/main/AndroidManifest.xml

      - name: Set Android app label
        run: |
          sed -i 's/android:label="parin_litner"/android:label="Parin Litner"/' android/app/src/main/AndroidManifest.xml || true

      - name: Apply Parin Litner logo and prepare focus audio
        run: |
          mkdir -p assets/audio
          test -s assets/parin_litner_icon.png
          python3 - <<'PY'
          import struct, zlib
          p='assets/parin_litner_icon.png'; b=open(p,'rb').read()
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'Logo is not PNG'
          pos=8
          while pos < len(b):
              if pos + 12 > len(b): raise AssertionError('PNG truncated')
              n=struct.unpack('>I',b[pos:pos+4])[0]; t=b[pos+4:pos+8]
              end=pos+12+n
              if end > len(b): raise AssertionError('PNG chunk truncated')
              d=b[pos+8:pos+8+n]
              c=struct.unpack('>I',b[pos+8+n:pos+12+n])[0]
              assert zlib.crc32(t+d)&0xffffffff == c, 'PNG CRC mismatch'
              pos=end
              if t == b'IEND': break
          assert pos <= len(b), 'PNG truncated'
          print('Valid logo PNG:', len(b), 'bytes')
          PY
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp assets/parin_litner_icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done
          python3 - <<'PY'
          import math, random, struct, wave, os
          sr=22050; duration=18; n=sr*duration; out='assets/audio'; random.seed(20260909)
          def write(name, fn):
              with wave.open(os.path.join(out,name),'w') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  frames=bytearray()
                  for i in range(n): frames += struct.pack('<h', int(max(-1,min(1,fn(i/sr)))*26000))
                  w.writeframes(frames)
          def note(t,f,s,l,a=.12):
              if t<s or t>s+l: return 0
              u=t-s; e=min(1,u*7)*min(1,(l-u)*2)
              return a*e*(math.sin(2*math.pi*f*u)+.35*math.sin(4*math.pi*f*u))
          ch=[(261.63,329.63,392,493.88),(220,261.63,329.63,392),(246.94,293.66,369.99,440),(196,246.94,293.66,392)]
          def lofi(t):
              x=0; bar=4.5
              for j in range(4):
                  for k,f in enumerate(ch[j]): x+=note(t,f,j*bar,bar-.15,.045 if k else .065)
              beat=t%1.125; return x+.18*math.exp(-beat*22)*math.sin(2*math.pi*58*t)+.01*random.uniform(-1,1)
          def rain(t): return .028*random.uniform(-1,1)+.015*sum(math.sin(2*math.pi*(95+k*41)*t) for k in range(3))
          def deep(t): return .025*math.sin(2*math.pi*55*t)+.018*math.sin(2*math.pi*82.5*t)+.012*math.sin(2*math.pi*110*t+math.sin(t*.3))
          write('lofi_night.wav',lofi); write('rainy_focus.wav',rain); write('deep_focus.wav',deep)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -p build/app/outputs/flutter-apk/app-release.apk classes.dex | strings | grep -q 'com/parin/parin_litner/MainActivity'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -Eq 'mipmap-(hdpi|xhdpi|xxhdpi|xxxhdpi).*ic_launcher'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
